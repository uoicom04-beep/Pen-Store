name: Build Pen Store
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'เลขเวอร์ชันที่จะปล่อย เช่น v1.0.0'
        required: true
        default: 'v1.0.0'
      release:
        description: 'ปล่อยเป็น Release (ติ๊ก = ปล่อย / ไม่ติ๊ก = แค่ build)'
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build:win -- --publish never
      - uses: actions/upload-artifact@v4
        with: { name: PenStore-exe, path: dist/PenStore.exe }
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build:linux -- --publish never
      - uses: actions/upload-artifact@v4
        with: { name: PenStore-linux, path: dist/PenStore.AppImage }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses (SDK ติดมากับ runner อยู่แล้ว)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: bash ./scripts/android-setup.sh
      - uses: actions/upload-artifact@v4
        with: { name: PenStore-apk, path: PenStore.apk }
  release:
    needs: [windows, linux, android]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Pen Store ${{ inputs.version || github.ref_name }}
          files: |
            out/PenStore.exe
            out/PenStore.AppImage
            out/PenStore.apk
          generate_release_notes: true
