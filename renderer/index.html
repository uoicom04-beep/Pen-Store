<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pen Store</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="banner">
  <div class="bn-in">
    <img src="logo.svg" alt="">
    <div><h1>PEN <b>STORE</b></h1><small>GAME LAUNCHER // itch.io</small></div>
  </div>
</header>
<div id="app">
  <aside>
    <div class="mh"><span>MAIN MENU</span></div>
    <nav>
      <button class="nav on" data-v="store"><span>ร้านเกม</span></button>
      <button class="nav" data-v="lib"><span>คลังของฉัน</span></button>
    </nav>
    <label class="lbl" for="sort">เรียงตาม</label>
    <select id="sort"><option value="">ยอดนิยม</option><option value="new-and-popular">มาใหม่</option><option value="top-rated">คะแนนสูง</option></select>
    <label class="lbl" for="flt">แสดง</label>
    <select id="flt"><option value="">ทุกเกม</option><option value="free">เกมฟรี</option><option value="platform-windows">Windows</option><option value="html5">เล่นบนเว็บ (HTML5)</option></select>
    <div class="lbl">หมวดหมู่</div>
    <div id="tags"></div>
  </aside>
  <main>
    <div class="bar">
      <input id="q" type="search" placeholder="ค้นหาเกม แล้วกด Enter  (พิมพ์ #horror เพื่อค้นตามแท็ก)" autocomplete="off" spellcheck="false">
      <button class="btn" id="go"><span>ค้นหา</span></button>
      <button class="btn ghost" id="url"><span>＋ ลิงก์เกม</span></button>
    </div>
    <section class="frame"><div class="frame-in"><div id="grid"></div></div><div class="ftab">GAME MENU</div></section>
  </main>
</div>
<footer class="sb"><i></i><b class="who">PEN STORE</b><i></i><span id="ss">พร้อม</span><span class="sp"></span><span>แสดง <b id="sn">0</b> เกม</span><span>ติดตั้งแล้ว <b id="si">0</b></span></footer>

<div class="ov" id="modal"><div class="box" id="box"></div></div>

<div class="ov" id="dlg"><div class="box small"><div class="in">
  <h2 id="dt"></h2><p id="dm" class="dim"></p>
  <input id="di" class="field">
  <div class="row"><button class="btn" id="dok">ตกลง</button><button class="btn ghost" id="dno">ยกเลิก</button></div>
</div></div></div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
