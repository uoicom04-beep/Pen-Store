<!doctype html><html lang="th"><head><meta charset="utf-8"><title>Pen Store</title><link rel="icon" href="logo.svg">
<style>
:root{--g:#00ff9c;--c:#00d4ff;--m:#ff2bd6;--bg:#05080a;--p:#0a1115;--p2:#0e181d;--line:#15343c;--dim:#6f9a96;--tx:#cfeee6}
*{box-sizing:border-box;border-radius:0}
::selection{background:var(--g);color:#000}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:#03070a}::-webkit-scrollbar-thumb{background:#0f4a3f}::-webkit-scrollbar-thumb:hover{background:var(--g)}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:13px "Cascadia Mono",Consolas,"Noto Sans Thai",Tahoma,monospace;overflow:hidden}
#rain{position:fixed;inset:0;z-index:0;opacity:.13;pointer-events:none}
body:after{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000030 2px 3px)}
#app{position:relative;z-index:1;display:flex;flex:1;min-height:0}
aside{width:236px;flex-shrink:0;background:#070d10ee;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid var(--line)}
.brand img{width:40px;height:40px;filter:drop-shadow(0 0 8px #00ff9c88)}
.brand h1{margin:0;font-size:18px;letter-spacing:4px;color:#fff;line-height:1}.brand h1 b{color:var(--g);text-shadow:0 0 10px var(--g)}.brand small{color:var(--dim);font-size:10px;letter-spacing:2px}
.sec{padding:10px 14px 4px;color:var(--dim);font-size:10px;letter-spacing:3px}
.nav{padding:8px 14px;cursor:pointer;color:var(--dim);border-left:2px solid transparent;transition:.12s;white-space:nowrap}
.nav:hover{color:var(--g);background:#00ff9c0d}.nav.on{color:#000;background:var(--g);border-left-color:#fff;font-weight:700}
#tags{overflow:auto;flex:1;padding-bottom:10px}#tags .nav{padding:4px 14px}#tags .nav:before{content:"#"}#tags .nav.on:before{content:"▶ "}
select{width:calc(100% - 28px);margin:4px 14px 6px;background:#000;color:var(--g);border:1px solid var(--line);padding:6px;font:inherit;outline:0}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{display:flex;gap:8px;padding:10px 14px;background:#070d10ee;border-bottom:1px solid var(--line);align-items:center}
.pr{color:var(--g);white-space:nowrap}.pr i{color:var(--c);font-style:normal}
#q{flex:1;background:#000;border:1px solid var(--line);color:var(--g);padding:9px 12px;font:inherit;outline:0;caret-color:var(--g)}#q:focus{border-color:var(--g);box-shadow:0 0 12px #00ff9c44}
#q::placeholder{color:#2d5f57}
.btn{background:var(--g);color:#000;border:0;padding:9px 16px;font-family:inherit;font-weight:700;font-size:12px;letter-spacing:1px;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:.12s}
.btn:hover{background:#fff;box-shadow:0 0 18px var(--g)}.btn.g{background:#0c1e22;color:var(--c);outline:1px solid var(--line)}.btn.g:hover{background:var(--c);color:#000}.btn.r{background:#2a0a14;color:#ff4d6d}.btn.r:hover{background:#ff4d6d;color:#000}
#grid{flex:1;overflow:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;align-content:start}
.card{position:relative;background:var(--p);border:1px solid var(--line);cursor:pointer;transition:.15s;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.card:hover{border-color:var(--g);transform:translateY(-3px);background:var(--p2);box-shadow:0 0 22px #00ff9c33}
.card .im{aspect-ratio:315/250;background:linear-gradient(135deg,#0b2a26,#0a1220);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:42px;color:#1c5a4e}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.3s}.card:hover img{transform:scale(1.07)}
.card .im:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,#05080acc)}
.card .bd{padding:8px 10px 10px}.t{font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.a{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gn{display:inline-block;margin-top:6px;font-size:10px;color:var(--c);border:1px solid #0d4a57;padding:1px 6px}
.badge{position:absolute;z-index:2;top:8px;left:8px;background:var(--g);color:#000;font-size:10px;font-weight:700;padding:2px 7px;letter-spacing:1px}
#more{grid-column:1/-1;justify-self:center}.msg{grid-column:1/-1;text-align:center;color:var(--dim);padding:40px;line-height:1.8}.msg b{color:var(--g)}.msg code{color:var(--c);word-break:break-all}
.sb{display:flex;gap:18px;padding:5px 14px;background:#03070a;border-top:1px solid var(--line);color:var(--dim);font-size:11px;position:relative;z-index:1}.sb b{color:var(--g)}.sb .sp{flex:1}
.ov{position:fixed;inset:0;z-index:20;background:#000c;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.box{background:var(--p);border:1px solid var(--g);box-shadow:0 0 40px #00ff9c33;width:900px;max-width:94vw;max-height:92vh;overflow:auto;clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px))}
#main{width:100%;height:380px;object-fit:contain;background:#000;display:block}
.th{display:flex;gap:6px;padding:8px;background:#03070a;overflow:auto}.th img{height:64px;cursor:pointer;opacity:.5;border:2px solid transparent}.th img.on,.th img:hover{opacity:1;border-color:var(--g)}
.in{padding:16px 20px 20px}.in h2{margin:0 0 4px;color:#fff;font-size:20px}.in h2:before{content:"> ";color:var(--g)}
.dsc{white-space:pre-wrap;max-height:200px;overflow:auto;margin:12px 0;line-height:1.6;color:#a9cfc6;border-left:2px solid var(--line);padding-left:12px}
.inf{margin:8px 0;font-size:12px}.inf div{padding:2px 0;border-bottom:1px dashed #102a2f}.inf b{color:var(--c);display:inline-block;min-width:120px;font-weight:400}
.chip{display:inline-block;margin:2px 4px 2px 0;padding:1px 7px;border:1px solid #0d4a57;color:var(--g);cursor:pointer}.chip:hover{background:var(--g);color:#000}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.dlg{width:520px}.dlg .in input{width:100%;background:#000;border:1px solid var(--line);color:var(--g);padding:10px;font:inherit;outline:0;margin:10px 0}.dlg .in input:focus{border-color:var(--g)}
  .up{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);margin:4px 0;background:#070d10}.up .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.up .pf{color:var(--m);font-size:11px;min-width:70px}.up .sz{color:var(--dim);font-size:11px}.up.dim{opacity:.5}.up .btn{padding:5px 10px;font-size:11px}
#dl{color:var(--g);margin:8px 0;min-height:16px;white-space:pre-wrap}
#boot{position:fixed;inset:0;z-index:100;background:#000;color:var(--g);padding:40px;font-size:14px;line-height:1.9;transition:opacity .5s;white-space:pre}
</style></head><body>
<canvas id="rain"></canvas>
<div id="boot"></div>
<div id="app">
<aside>
 <div class="brand"><img src="logo.svg"><div><h1>PEN<b>STORE</b></h1><small>GAME HUB // v1.0</small></div></div>
 <div class="sec">// MENU</div>
 <div class="nav on" data-v="store">STORE ร้านเกม</div><div class="nav" data-v="lib">LIBRARY คลังของฉัน</div>
 <div class="sec">// SORT</div>
 <select id="sort"><option value="">POPULAR ยอดนิยม</option><option value="new-and-popular">NEW มาใหม่</option><option value="top-rated">TOP RATED คะแนนสูง</option></select>
 <div class="sec">// FILTER</div>
 <select id="flt"><option value="">ALL ทุกเกม</option><option value="free">FREE ฟรี</option><option value="platform-windows">WINDOWS</option><option value="html5">WEB (HTML5)</option></select>
 <div class="sec">// TAGS</div><div id="tags"></div>
</aside>
<main>
 <div class="bar"><span class="pr">root@<i>penstore</i>:~$</span><input id="q" placeholder="ค้นหาเกม... หรือพิมพ์ #horror เพื่อกรองแท็ก (Enter)"><button class="btn" id="go">SEARCH</button><button class="btn g" id="url">+ LINK</button></div>
 <div id="grid"></div>
</main></div>
<div class="sb"><span>SRC: <b>itch.io</b></span><span>LOADED: <b id="sn">0</b></span><span>INSTALLED: <b id="si">0</b></span><span class="sp"></span><span id="ss">READY</span></div>
<div class="ov" id="modal"><div class="box" id="box"></div></div>
<div class="ov" id="dlg"><div class="box dlg"><div class="in"><h2 id="dt"></h2><input id="di"><div class="row"><button class="btn" id="dok">OK</button><button class="btn g" id="dno">ยกเลิก</button></div></div></div></div>
<script>
const TAGS=['action','adventure','horror','puzzle','platformer','rpg','survival','shooter','strategy','multiplayer','racing','casual','pixel-art','2d','3d','retro','simulation','card-game','fighting','visual-novel','roguelike','cute','sci-fi','fantasy','difficult','funny','atmospheric','short','idle','tower-defense','farming','stealth','zombies','space','cyberpunk','rhythm','sandbox','arcade','point-and-click','minecraft'];
const $=s=>document.querySelector(s);
let st={view:'store',tag:'',q:'',page:1,inst:{},lib:[],busy:false};
const slug=t=>t.toLowerCase().trim().replace(/\s+/g,'-');
// boot
(async()=>{const L=['[ OK ] INIT PEN-STORE CORE','[ OK ] LOADING GAME INDEX','[ OK ] MOUNTING SAVE VAULT','[ OK ] CONNECTING itch.io','> ACCESS GRANTED_'];const b=$('#boot');for(const l of L){b.textContent+=l+'\n';await new Promise(r=>setTimeout(r,140))}b.style.opacity=0;setTimeout(()=>b.remove(),500)})();
// matrix rain
(()=>{const c=$('#rain'),x=c.getContext('2d');let cols,dr;const R=()=>{c.width=innerWidth;c.height=innerHeight;cols=Math.floor(c.width/16);dr=Array(cols).fill(0).map(()=>Math.random()*c.height/16)};R();onresize=R;
setInterval(()=>{x.fillStyle='rgba(5,8,10,.12)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#00ff9c';x.font='14px monospace';dr.forEach((y,i)=>{x.fillText(String.fromCharCode(0x30A0+Math.random()*60),i*16,y*16);dr[i]=y*16>c.height&&Math.random()>.975?0:y+1})},70)})();
// tags
const tg=$('#tags');tg.innerHTML='<div class="nav on" data-t="" style="padding:4px 14px">ALL</div>'+TAGS.map(t=>`<div class="nav" data-t="${t}">${t}</div>`).join('');
tg.firstChild.classList.add('all');
function markTag(){tg.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.t===st.tag))}
tg.onclick=e=>{const t=e.target.dataset.t;if(t===undefined)return;setTag(t)};
function setTag(t){st.tag=t;st.q='';$('#q').value=t?'#'+t:'';markTag();setNav('store');store(true)}
function setNav(v){st.view=v;document.querySelectorAll('aside>.nav').forEach(x=>x.classList.toggle('on',x.dataset.v===v))}
document.querySelectorAll('aside>.nav').forEach(n=>n.onclick=()=>{setNav(n.dataset.v);n.dataset.v==='lib'?lib():store(true)});
function status(t){$('#ss').textContent=t}
function msg(html){$('#grid').innerHTML='<div class="msg">'+html+'</div>'}
function card(x){const d=document.createElement('div');d.className='card';
 d.innerHTML='<div class="im"><span></span></div><div class="bd"><div class="t"></div><div class="a"></div></div>';
 d.querySelector('span').textContent=(x.title||'?')[0].toUpperCase();
 if(x.thumb){const i=new Image();i.referrerPolicy='no-referrer';i.onload=()=>d.querySelector('.im').prepend(i);i.src=x.thumb}
 if(st.inst[x.id]){const b=document.createElement('div');b.className='badge';b.textContent='INSTALLED';d.querySelector('.im').appendChild(b)}
 d.querySelector('.t').textContent=x.title;d.querySelector('.a').textContent=(x.author||'')+' · '+x.source;
 if(x.genre){const g=document.createElement('span');g.className='gn';g.textContent=x.genre.trim();d.querySelector('.bd').appendChild(g)}
 if(x.price){const g=document.createElement('span');g.className='gn';g.style.cssText='margin-left:4px;color:#ffd400;border-color:#5a4a00';g.textContent=x.price.trim();d.querySelector('.bd').appendChild(g)}
 d.onclick=()=>detail(x);return d}
let shown=0;
function render(games,replace){const g=$('#grid');if(replace){g.innerHTML='';shown=0}g.querySelector('#more')?.remove();
 games.forEach(x=>g.appendChild(card(x)));shown+=games.length;$('#sn').textContent=shown;
 if(st.view==='store'&&games.length){const b=document.createElement('button');b.id='more';b.className='btn';b.textContent='LOAD MORE โหลดเพิ่ม';b.onclick=()=>store(false);g.appendChild(b)}}
async function refreshInst(){st.inst=await pen.inst();$('#si').textContent=Object.keys(st.inst).length}
async function store(reset){if(st.busy)return;st.busy=true;await refreshInst();if(reset)st.page=1;else st.page++;
 if(reset)msg('<b>LOADING...</b><br>กำลังดึงรายชื่อเกมจาก itch.io');status('FETCHING...');
 const r=await pen.search({q:st.q,tag:st.tag,page:st.page,sort:$('#sort').value,filter:$('#flt').value});st.busy=false;
 if(!r.ok){status('ERROR');return msg('<b>ERROR</b><br>'+r.error+'<br><br><button class="btn" onclick="store(true)">RETRY</button>')}
 if(!r.games.length&&reset){status('NO RESULT');return msg('<b>ไม่พบเกม</b><br>ลองคำค้น/แท็กอื่น หรือเช็คอินเทอร์เน็ต<br><code>'+r.url+'</code><br><br><button class="btn" onclick="store(true)">RETRY</button>')}
 if(!r.games.length){status('END');$('#more')?.remove();return}
 render(r.games,reset);status('READY')}
async function lib(){await refreshInst();st.lib=await pen.lib();const q=st.q.toLowerCase();
 const l=st.lib.filter(g=>!q||g.title.toLowerCase().includes(q));
 if(!l.length)return msg('<b>LIBRARY ว่าง</b><br>กดเกมแล้วเพิ่มเข้าคลัง หรือกด + LINK เพื่อใส่ลิงก์เกม');render(l,true);status('LIBRARY')}
const ask=(title,ph)=>new Promise(res=>{$('#dt').textContent=title;const i=$('#di');i.value='';i.placeholder=ph;$('#dlg').style.display='flex';i.focus();
 const done=v=>{$('#dlg').style.display='none';res(v)};$('#dok').onclick=()=>done(i.value.trim());$('#dno').onclick=()=>done(null);i.onkeydown=e=>{if(e.key==='Enter')done(i.value.trim());if(e.key==='Escape')done(null)}});
pen.onProgress(t=>{const d=$('#dl');if(d)d.textContent=t;status(t)});
async function detail(g){await refreshInst();st.lib=await pen.lib();const has=st.lib.some(x=>x.id===g.id),ins=st.inst[g.id],b=$('#box');
 b.innerHTML='<img id="main"><div class="th" id="th"></div><div class="in"><h2></h2><div class="a"></div><div class="dsc" id="dsc">LOADING...</div><div class="inf" id="inf"></div><div id="ups"></div><div id="dl"></div><div class="row" id="acts"></div></div>';
 const mi=$('#main');if(g.thumb)mi.src=g.thumb;else mi.style.display='none';
 b.querySelector('h2').textContent=g.title;b.querySelector('.a').textContent=(g.author||'')+' · '+g.source;$('#dsc').textContent=g.desc||'';
 const btn=(txt,cls,fn)=>{const x=document.createElement('button');x.className='btn '+cls;x.textContent=txt;x.onclick=fn;$('#acts').appendChild(x);return x};
 const close=()=>$('#modal').style.display='none';
 const acts=(r)=>{$('#acts').innerHTML='';
  if(ins)btn(`▶ PLAY (INSTALLED ${(ins.size/1048576).toFixed(1)} MB)`,'',()=>pen.play(g,true));
  else if(r&&r.html5){btn('⬇ INSTALL & PLAY (WEB)','',async()=>{await pen.play(g,true);if(!has)await pen.libToggle(g)});btn('▶ PLAY TEMP เล่นชั่วคราว','g',()=>pen.play(g,false))}
  btn(has?'★ REMOVE FROM LIBRARY':'☆ ADD TO LIBRARY','g',async()=>{await pen.libToggle(g);close();if(st.view==='lib')lib()});
  btn('OPEN PAGE','g',()=>pen.ext(g.url));
  if(ins||(r&&r.html5))btn('CLEAR SAVE','g',async()=>{if(confirm('ลบ save ของเกมนี้? (เฉพาะ save ของเกมเว็บในแอป)'))await pen.clearSave(g.id)});
  if(ins)btn('UNINSTALL','r',async()=>{if(confirm('ลบไฟล์เกมออกจากเครื่อง?')){await pen.uninstall(g.id);close();st.view==='lib'?lib():store(true)}});
  btn('CLOSE','g',close)};
 acts(null);$('#modal').style.display='flex';
 const run=async(u,temp)=>{document.querySelectorAll('#ups .btn,#acts .btn').forEach(x=>x.disabled=true);$('#dl').textContent='STARTING...';
  const r=await pen.dl({game:g,uploadId:u.id,temp});
  if(!r.ok){$('#dl').textContent='ERROR: '+r.error;document.querySelectorAll('#ups .btn,#acts .btn').forEach(x=>x.disabled=false);return}
  if(r.manual){$('#dl').textContent='โหลดแล้ว แต่ไฟล์ไม่ใช่ zip/exe (เช่น 7z/rar) — เปิดโฟลเดอร์ให้แล้ว แตกไฟล์เองได้เลย';document.querySelectorAll('#ups .btn,#acts .btn').forEach(x=>x.disabled=false);return}
  if(!temp){if(!has)await pen.libToggle(g);await refreshInst();detail(g)}else{$('#dl').textContent='LAUNCHED ✓ (ไฟล์ชั่วคราวจะถูกลบเมื่อปิดเกม/ปิดแอป)';document.querySelectorAll('#ups .btn,#acts .btn').forEach(x=>x.disabled=false)}};
 const r=await pen.details(g.url);if(!r.ok){$('#dsc').textContent=g.desc||'โหลดรายละเอียดไม่ได้';return acts(null)}
 $('#dsc').textContent=r.desc||g.desc||'(ไม่มีคำอธิบาย)';
 const inf=$('#inf');inf.innerHTML='';r.info.forEach(([k,v])=>{const d=document.createElement('div'),bb=document.createElement('b');bb.textContent=k;d.appendChild(bb);
  if(/tag|genre/i.test(k)){v.split(/,\s*/).filter(Boolean).forEach(t=>{const c=document.createElement('span');c.className='chip';c.textContent='#'+t;c.onclick=()=>{close();setTag(slug(t))};d.appendChild(c)})}
  else d.appendChild(document.createTextNode(v));inf.appendChild(d)});
 if(r.shots.length){mi.style.display='block';mi.src=r.shots[0];const th=$('#th');th.innerHTML='';r.shots.forEach((s,k)=>{const i=new Image();i.src=s;if(!k)i.className='on';th.appendChild(i)});
  th.onclick=e=>{if(e.target.tagName!=='IMG')return;mi.src=e.target.src;th.querySelectorAll('img').forEach(i=>i.classList.toggle('on',i===e.target))}}else $('#th').style.display='none';
 const ups=$('#ups');ups.innerHTML='';
 if(r.uploads.length){const h=document.createElement('div');h.className='sec';h.style.padding='10px 0 4px';h.textContent='// DOWNLOADS ไฟล์เกม';ups.appendChild(h);
  [...r.uploads].sort((a,b)=>b.platforms.includes('win')-a.platforms.includes('win')).forEach(u=>{const w=u.platforms.includes('win')||!u.platforms.length;
   const d=document.createElement('div');d.className='up'+(w?'':' dim');
   d.innerHTML='<span class="pf"></span><span class="n"></span><span class="sz"></span>';
   d.querySelector('.pf').textContent='['+(u.platforms.map(p=>({win:'WIN',mac:'MAC',linux:'LINUX',android:'ANDROID'}[p])).join('/')||'?')+']';d.querySelector('.n').textContent=u.name;d.querySelector('.sz').textContent=u.size;
   if(w){const i=document.createElement('button');i.className='btn';i.textContent='⬇ INSTALL';i.onclick=()=>run(u,false);d.appendChild(i);const t=document.createElement('button');t.className='btn g';t.textContent='▶ TEMP';t.onclick=()=>run(u,true);d.appendChild(t)}
   ups.appendChild(d)})}
 else if(!r.html5&&!ins){$('#dl').textContent='ไม่พบไฟล์ดาวน์โหลดฟรีบนหน้านี้ (อาจเป็นเกมที่ต้องซื้อ/มีหน้าดาวน์โหลดแยก) — กด OPEN PAGE เพื่อเปิดหน้าเกม'}
 acts(r)}
$('#modal').onclick=e=>{if(e.target.id==='modal')e.target.style.display='none'};
function search(){let q=$('#q').value.trim();if(q.startsWith('#')){st.tag=slug(q.slice(1));st.q='';markTag()}else{st.q=q;st.tag='';markTag()}
 if(st.view==='lib')lib();else store(true)}
$('#q').addEventListener('mousedown',()=>pen.focus());$('#q').addEventListener('focus',()=>pen.focus());window.addEventListener('focus',()=>$('#q')===document.activeElement||0);
$('#go').onclick=search;$('#q').onkeydown=e=>e.key==='Enter'&&search();$('#sort').onchange=$('#flt').onchange=()=>st.view==='store'&&store(true);
$('#url').onclick=async()=>{const u=await ask('> ADD GAME LINK','วางลิงก์เกม เช่น https://xxx.itch.io/เกม');if(!u)return;
 try{new URL(/^https?:/i.test(u)?u:'https://'+u)}catch{return alert('ลิงก์ไม่ถูกต้อง')}
 status('ADDING...');const r=await pen.addUrl(u);status('READY');setNav('lib');await lib();detail(r.game)};
store(true);
</script></body></html>
